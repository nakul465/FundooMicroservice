apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: nakul465/fundoo-user:live
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: ConnectionStrings__FundooConnection
              value: "Host=postgres-service;Port=5432;Database=UserDb;Username=postgres;Password=FundooNotes@2026"
            - name: Jwt__Key
              value: "FundooSecretKeyForJwtAuthentication2026!#"
            - name: Jwt__Issuer
              value: "FundooApp"
            - name: Jwt__Audience
              value: "FundooUsers"
            - name: Jwt__OAuthIssuer
              value: "FundooOAuthServer"
            - name: Jwt__ExpiryMinutes
              value: "60"
            - name: NotificationService__BaseUrl
              value: "http://notification-service"
            - name: NotesService__BaseUrl
              value: "http://notes-service"
            - name: OAuth__Clients__UserService__Secret
              value: "UserSvcSecret_2026!#"
            - name: OAuth__Clients__GatewayService__Secret
              value: "GatewaySvcSecret_2026!#"
            - name: OAuth__Clients__NotificationService__Secret
              value: "NotifySvcSecret_2026!#"
            - name: Authentication__Google__ClientId
              valueFrom:
                secretKeyRef:
                  name: google-oauth-secret
                  key: client-id
            - name: Authentication__Google__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: google-oauth-secret
                  key: client-secret
            - name: Authentication__Google__PublicBaseUrl
              value: "https://172.198.78.144.sslip.io"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 80
      targetPort: 80
