apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: fundoo-gateway:live
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
            - name: Jwt__Key
              value: "FundooSecretKeyForJwtAuthentication2026!#"
            - name: Jwt__Issuer
              value: "FundooApp"
            - name: Jwt__Audience
              value: "FundooUsers"
            - name: InternalServiceAuth__SecretKey
              value: "FundooSecretKeyForJwtAuthentication2026!#"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-public-service
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
